<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Za moju devojku ❤️ - Pesme</title>
    <link rel="stylesheet" href="css/pesme_style.css" />
  </head>
  <body>
    <a href="meni.html" class="back-btn">⬅ Nazad na meni</a>

    <div id="stickers-container"></div>

    <div class="music-container">
      <h1>Naše plejliste 🎵</h1>
      <p class="subtitle">Izaberi raspoloženje bejb...</p>

      <div class="playlist-buttons">
        <button
          class="play-btn"
          onclick="pustiListu('bejb', this, event, '❤️')"
        >
          Bejb &lt;3
        </button>
        <button
          class="play-btn"
          onclick="pustiListu('djusi', this, event, '🍑')"
        >
          Djusi
        </button>
        <button
          class="play-btn"
          onclick="pustiListu('latina', this, event, '💃')"
        >
          Latina
        </button>
      </div>

      <!-- Uklonili smo inline stil, sada CSS radi sakrivanje -->
      <div class="player-wrapper" id="player-wrapper">
        <iframe
          id="yt-player"
          width="100%"
          height="450"
          src=""
          title="YouTube video player"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
          "
          allowfullscreen
        >
        </iframe>
      </div>
    </div>

    <script>
      const slikeStikera = [
        "https://cdn-icons-png.flaticon.com/512/3790/3790076.png",
        "https://cdn-icons-png.flaticon.com/512/3069/3069172.png",
        "https://cdn-icons-png.flaticon.com/512/3069/3069114.png",
        "https://cdn-icons-png.flaticon.com/512/3790/3790082.png",
      ];

      function napraviKisu() {
        const kontejner = document.getElementById("stickers-container");
        for (let i = 0; i < 12; i++) {
          let stiker = document.createElement("img");
          stiker.src =
            slikeStikera[Math.floor(Math.random() * slikeStikera.length)];
          stiker.classList.add("stiker");
          stiker.style.left = Math.random() * 95 + "vw";
          stiker.style.animationDuration = Math.random() * 4 + 6 + "s";
          stiker.style.animationDelay = Math.random() * 5 + "s";
          kontejner.appendChild(stiker);
        }
      }
      window.onload = napraviKisu;

      // OVDJE UBACI SVOJE ID-JEVE KOJE SI PREKOPIRAO SA YOUTUBE-A
      const plejliste = {
        bejb: "PL2D_SYUOIw2AfPrJBVUCEl3zP4WwsAPTA",
        djusi: "PLTvg7HS3CQAzTDyS0KRdy5Oe18kEo4GxZ",
        latina: "PLBSR-cMSgXTo5yZKCZjMIvp-MPtiG7v9B",
      };

      function pustiListu(imeListe, kliknutoDugme, event, emoji) {
        const playerWrapper = document.getElementById("player-wrapper");
        const ytPlayer = document.getElementById("yt-player");
        const svaDugmad = document.querySelectorAll(".play-btn");

        svaDugmad.forEach((btn) => btn.classList.remove("active"));
        kliknutoDugme.classList.add("active");

        let listaID = plejliste[imeListe];

        // LOGIKA ZA ZATVARANJE I OTVARANJE
        if (playerWrapper.classList.contains("show")) {
          // Ako je plejer vec tu, prvo ga "zatvori" (sakrij)
          playerWrapper.classList.remove("show");
          playerWrapper.classList.add("hide");

          // Sačekaj 300 milisekundi da se animacija završi, promeni pesmu i otvori opet
          setTimeout(() => {
            ytPlayer.src = `https://www.youtube.com/embed/videoseries?list=${listaID}`;
            playerWrapper.classList.remove("hide");
            playerWrapper.classList.add("show");
          }, 300);
        } else {
          // Ako se plejer otvara prvi put
          ytPlayer.src = `https://www.youtube.com/embed/videoseries?list=${listaID}`;
          playerWrapper.classList.add("show");
        }

        napraviEksploziju(event.clientX, event.clientY, emoji);
      }

      function napraviEksploziju(x, y, emoji) {
        const brojCestica = 15;

        for (let i = 0; i < brojCestica; i++) {
          let cestica = document.createElement("div");
          cestica.innerText = emoji;
          cestica.className = "emoji-particle";
          document.body.appendChild(cestica);

          const ugao = Math.random() * Math.PI * 2;
          const udaljenost = Math.random() * 100 + 50;
          const tx = Math.cos(ugao) * udaljenost;
          const ty = Math.sin(ugao) * udaljenost;

          cestica.style.left = x + "px";
          cestica.style.top = y + "px";

          cestica.style.setProperty("--tx", tx + "px");
          cestica.style.setProperty("--ty", ty + "px");

          setTimeout(() => {
            cestica.remove();
          }, 1000);
        }
      }
    </script>
  </body>
</html>
